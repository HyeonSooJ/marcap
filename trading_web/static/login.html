<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#161a21">
  <title>KIS Trader 로그인</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
  <form id="loginForm" class="panel login-box" autocomplete="on">
    <div class="brand"><span class="brand-mark">▲<b>▼</b></span><span class="brand-name">KIS Trader</span></div>
    <label for="pw">비밀번호</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    <p id="loginErr" class="login-err" hidden></p>
    <button class="submit buy" type="submit">로그인</button>
  </form>
  <script src="/static/js/login.js"></script>
</body>
</html>
