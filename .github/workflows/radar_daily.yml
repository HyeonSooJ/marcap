name: Run MarcapRadar Daily Briefing

on:
  workflow_run:
    workflows: ["Update KRX Marcap Dataset"]
    types:
      - completed
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  run-radar:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r radar/requirements.txt

      - name: Run daily radar pipeline
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python radar/src/pipeline.py

      - name: Commit and push report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add radar/output/reports/
          git diff-index --quiet HEAD || (git commit -m "radar: daily briefing [skip ci]" && git push origin master)
