name: Daily ETF Mover Check

on:
  schedule:
    # 18:35 KST (09:35 UTC) Monday through Friday - stock 데이터 갱신(18:30 KST) 직후
    - cron: '35 9 * * 1-5'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  check-etf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pykrx pandas

      - name: Run ETF daily check
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python etf_daily/check.py

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add etf_daily/data/
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "etf_daily: update daily mover check [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin master
            if git rebase origin/master && git push origin master; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "All push attempts failed"
          exit 1
